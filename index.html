@media(max-width:820px){.layout{display:block}aside{position:sticky;top:0;z-index:5;width:auto;height:auto;padding:12px 14px}aside .sub{display:none}aside h1{font-size:17px;margin:2px 0 8px}aside .nav{display:none}aside.open .nav{display:block;max-height:70vh;overflow:auto}.mtog{display:block;position:absolute;right:14px;top:14px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font:700 13px Inter;padding:7px 11px}main{padding:18px}.opts,.act,.exp{margin-left:0}}

 <h1>NeuroAnat &amp; ENT<br>QCM for the GOATs</h1>
 <div class="sub">Past questions from Prof. Fliyou &amp; Pr Hajjij, checked against your lectures.</div>
 <div class="gp" id="gp"></div><div class="nav" id="nav"></div>

<script>const Q = [
// ===================== CH1 INTRO & EMBRYOLOGY =====================
{c:"n1",s:"CC ANAT3 2025–26",q:"Concerning the organisation of the encephalon:",o:["The encephalon is located in the cranial cavity","The encephalon corresponds to the posterior lobe of the pituitary gland","The encephalon secretes the locus coeruleus","The encephalon includes, among others, the cerebellum"],a:[0,3],e:"The brain (encephalon) lies in the skull and is made of cerebrum, brainstem and cerebellum. The other two statements are nonsense."},
{c:"n1",s:"CC ANAT3 2025–26",q:"Concerning the systematisation of the nervous system:",o:["The nervous system includes an integrating part: the central nervous system","The spinal cord is part of the central nervous system","The cerebrum (cerveau) is a synonym of the encephalon","The spinal cord is part of the peripheral nervous system"],a:[0,1],e:"CNS = brain + spinal cord (command centre). The encephalon is wider than the cerebrum: it also contains brainstem and cerebellum."},

// ===================== CH2 CEREBRUM =====================
{c:"n2",s:"Fliyou Test 1",q:"What is the primary function of the falx cerebri?",o:["Memory storage","Separation of the cerebral hemispheres","Regulation of sensory perception","Motor control"],a:[1],e:"The falx cerebri is the vertical fold of dura mater in the longitudinal fissure; it incompletely separates the two hemispheres."},
{c:"n2",s:"Fliyou Test 1",q:"Which structure separates the cerebrum from the cerebellum?",o:["Corpus callosum","Tentorium cerebelli","Falx cerebri","Internal perpendicular fissure"],a:[1],e:"The horizontal tentorium cerebelli divides the cavity into supratentorial (cerebrum) and infratentorial (cerebellum + brainstem) levels."},
{c:"n2",s:"Fliyou Test 1",q:"The foramen of Pacchioni is associated with which structure?",o:["Corpus callosum","Tentorium cerebelli","Falx cerebri","Lateral ventricles"],a:[1],e:"It is the opening bounded by the small circumference of the tentorium cerebelli; the diencephalon–midbrain junction passes through it."},
{c:"n2",s:"Fliyou Test 1",q:"What is the primary function of the corpus callosum?",o:["Sensory perception","Interhemispheric connectivity","Memory storage","Motor control"],a:[1],e:"White-matter tract of ~200 million fibres linking the two hemispheres."},
{c:"n2",s:"Fliyou Test 1",q:"Which sulcus separates the frontal lobe from the parietal lobe?",o:["Lateral sulcus","Central sulcus","Parieto-occipital sulcus","Pre-occipital notch"],a:[1],e:"Central sulcus (Rolando): frontal in front, parietal behind."},
{c:"n2",s:"Fliyou Test 3",q:"The central sulcus separates which two lobes?",o:["Frontal and temporal","Frontal and parietal","Parietal and occipital","Temporal and occipital"],a:[1],e:"Rolando = frontal | parietal. Sylvius = frontal + parietal | temporal."},
{c:"n2",s:"Fliyou Test 2",q:"The postcentral gyrus belongs to which lobe?",o:["Occipital lobe","Frontal lobe","Temporal lobe","Parietal lobe"],a:[3],e:"The parietal lobe has 3 gyri: postcentral (sensory strip), superior and inferior parietal."},
{c:"n2",s:"Fliyou Test 2",q:"What is the primary role of the fornix?",o:["Motor control","Memory and limbic-system connectivity","Sensory perception","Language processing"],a:[1],e:"C-shaped bundle; the main pathway of the hippocampus (limbic system, memory)."},
{c:"n2",s:"Fliyou Test 3",q:"The fornix connects the hippocampus to which subcortical structures?",o:["Caudate nucleus","Lenticular nucleus","Mammillary bodies","Subthalamic nucleus"],a:[2],e:"Anterior columns → mammillary bodies; posterior columns → hippocampus."},
{c:"n2",s:"Fliyou Test 2",q:"Which commissure lies in front of the fornix and the genu of the corpus callosum?",o:["Anterior white commissure","Posterior white commissure","Corpus callosum","Pyramidal tract"],a:[0],e:"The posterior white commissure lies under the pineal gland, in the posterior wall of the 3rd ventricle."},
{c:"n2",s:"Fliyou Test 2",q:"What is the role of the corticospinal tract?",o:["Regulation of sensory perception","Voluntary motor function","Memory storage","Language processing"],a:[1],e:"Pyramidal (corticospinal) tract = main pathway of voluntary movement, from the primary motor cortex."},
{c:"n2",s:"Fliyou Test 1",q:"What is the primary distinction between pyramidal and extrapyramidal tracts?",o:["Pyramidal tracts control voluntary movements; extrapyramidal tracts are responsible for involuntary movements","Pyramidal tracts supply the body; extrapyramidal tracts supply head and neck","Pyramidal tracts have synapses along the way; extrapyramidal tracts do not","Pyramidal tracts start in the brainstem; extrapyramidal tracts start in the cortex"],a:[0],e:"Pyramidal = voluntary movement. The basal ganglia belong to the extrapyramidal (automatic, involuntary) motor system."},
{c:"n2",s:"Fliyou Test 1",q:"Do most fibres of the corticospinal tract decussate?",o:["Yes","No"],a:[0],e:"Most fibres (75–90%) cross in the medulla (pyramidal decussation) — so each hemisphere controls the opposite side."},
{c:"n2",s:"Fliyou Test 3",q:"What may result from a stroke on the right side of the brain?",o:["Left-sided weakness","Right-sided weakness","Bilateral weakness","Language impairment"],a:[0],e:"Each hemisphere controls the opposite side. Language is usually in the LEFT hemisphere, so D is not expected. (The original key was wrong here.)"},
{c:"n2",s:"Fliyou Test 3",q:"Which imaging technique is most suitable for functional mapping of the brain?",o:["CT scan","MRI (functional MRI)","EEG","PET scan"],a:[1],e:"The lecture cites functional MRI (and tractography) to map language areas before surgery."},
{c:"n2",s:"Fliyou Test 1",q:"What is the primary function of the basal ganglia?",o:["Memory processing","Motor control","Visual perception","Auditory processing"],a:[1],e:"Subcortical nuclei that fine-tune voluntary movement (extrapyramidal system)."},
{c:"n2",s:"Fliyou Test 3",q:"What is the role of the basal ganglia in fine-tuning voluntary movement?",o:["Receive impulses from the thalamus","Convey instructions to the limbic system","Process and adjust impulses from the cerebral cortex","Directly control skeletal muscles"],a:[2],e:"Cortex → basal ganglia (process, adjust) → thalamus → cortex → pyramidal tract → muscles."},
{c:"n2",s:"Fliyou Test 1",q:"Which part of the basal ganglia is considered part of the limbic system?",o:["Caudate nucleus","Putamen","Nucleus accumbens","Subthalamic nucleus"],a:[2],e:"The ventral striatum (nucleus accumbens + olfactory tubercle) is considered limbic."},
{c:"n2",s:"Fliyou Test 1",q:"Which neurotransmitter is essential for the basal ganglia, especially at the input nuclei?",o:["Serotonin","Dopamine","Acetylcholine","GABA"],a:[1],e:"Dopamine — its loss causes Parkinson's disease."},
{c:"n2",s:"Fliyou Test 1",q:"What separates the external and internal segments of the globus pallidus?",o:["Medial medullary lamina","Internal capsule","Subthalamic nucleus","Cerebral peduncle"],a:[0],e:"A vertical sheet of white matter: the medial (internal) medullary lamina → GPe and GPi."},
{c:"n2",s:"Fliyou Test 1",q:"In Parkinson's disease, which nucleus is often targeted for neurostimulation?",o:["Substantia nigra","Caudate nucleus","Globus pallidus","Subthalamic nucleus"],a:[3],e:"The slides name the subthalamic nucleus as the neurostimulation target (the globus pallidus is also a DBS target, noted in class — but the expected answer is D)."},
{c:"n2",s:"Fliyou Test 2",q:"Which part of the caudate nucleus forms the lateral wall of the lateral ventricle?",o:["Head","Body","Tail","Putamen"],a:[0],e:"Head → lateral wall of the lateral ventricle; tail → roof of the inferior horn."},
{c:"n2",s:"Fliyou Test 2",q:"The substantia nigra is functionally part of the basal ganglia despite being located in the:",o:["Forebrain","Midbrain","Hindbrain","Cerebellum"],a:[1],e:"Between the cerebral peduncle and the tegmentum of the midbrain."},
{c:"n2",s:"Fliyou Test 3",q:"What divides the cerebral peduncles from the tegmentum on both sides of the midbrain?",o:["Substantia nigra","Internal capsule","Medial lemniscus","Subthalamic nucleus"],a:[0],e:"Lecture: the substantia nigra divides the cerebral peduncles from the tegmentum."},
{c:"n2",s:"Fliyou Test 2",q:"In which part of the brain are the subthalamic nuclei located?",o:["Diencephalon (junction with the midbrain)","Midbrain","Hindbrain","Forebrain"],a:[0],e:"Small biconvex nuclei at the diencephalon–midbrain junction, ventral to the thalamus."},
{c:"n2",s:"CC ANAT3 2025–26",q:"About the cerebral hemispheres:",o:["The central grey matter is made of masses of cell bodies called \"basal nuclei\"","Each hemisphere contains two ventricular cavities","Each hemisphere has a peripheral layer (pallium) made of grey matter","Each hemisphere has a peripheral layer (pallium) made of white matter"],a:[0,2],e:"Grey matter = peripheral cortex + deep basal ganglia. Each hemisphere contains ONE lateral ventricle."},

// ===================== CH3 DIENCEPHALON =====================
{c:"n3",s:"Fliyou Test 1",q:"Where is the diencephalon located?",o:["Inferior to the corpus callosum","Superior to the brainstem","Lateral to the cerebral cortex","Anterior to the thalamus"],a:[0,1],e:"Around the 3rd ventricle, above the brainstem and below the corpus callosum."},
{c:"n3",s:"Fliyou Test 1",q:"How many main parts does the diencephalon have?",o:["Two — thalamus, hypothalamus","Three — epithalamus, thalamus, hypothalamus","Four — epithalamus, thalamus, subthalamus, hypothalamus","Five — thalamus, subthalamus, hypothalamus, pineal gland, epithalamus"],a:[2],e:"\"THE Sub\": Thalamus, Hypothalamus, Epithalamus, Subthalamus. The pineal gland belongs to the epithalamus."},
{c:"n3",s:"Fliyou Test 1",q:"What is the primary function of the thalamus?",o:["Motor control","Homeostasis","Relay and processing centre for sensory information","Endocrine regulation"],a:[2],e:"Main relay of all senses except smell — the \"gateway to the cortex\"."},
{c:"n3",s:"Fliyou Test 1",q:"How is one thalamus connected to the other?",o:["Via the choroid plexus","Through the pineal gland","Through the internal medullary lamina","By the interthalamic adhesion"],a:[3],e:"The interthalamic adhesion crosses the 3rd ventricle."},
{c:"n3",s:"Fliyou Test 1",q:"What divides each thalamus into anterior, medial and lateral parts?",o:["Fornix","Pineal gland","Internal medullary lamina","Cerebral aqueduct of Sylvius"],a:[2],e:"A Y-shaped white lamina."},
{c:"n3",s:"Fliyou Test 2",q:"Which part of the thalamus forms the posterior wall of the interventricular foramen of Monro?",o:["Anterior","Medial","Superior","Posterior"],a:[0],e:"Its anterior pole."},
{c:"n3",s:"Fliyou Test 2",q:"What is the most posterior part of the thalamus called?",o:["Pulvinar","Habenula","Corpora quadrigemina","Internal capsule"],a:[0],e:"Pulvinar = posterior nuclei of the thalamus."},
{c:"n3",s:"Fliyou Test 2",q:"The hypothalamus regulates:",o:["Motor responses","Sensory processing","Homeostasis","Consciousness"],a:[2],e:"Hunger, thirst, temperature, blood pressure, heart rate; interface nervous–endocrine systems."},
{c:"n3",s:"Fliyou Test 2",q:"How many regions is the hypothalamus divided into?",o:["One","Two","Three","Four"],a:[2],e:"Supraoptic, tuberal, mammillary (\"Super Tubes Make\")."},
{c:"n3",s:"Fliyou Test 2",q:"What connects the pituitary gland to the brain?",o:["Hypophyseal placode","Infundibulum","Median eminence","Sphenoid sinus"],a:[1],e:"The cone-shaped hypothalamus ends in the infundibulum, a tubular connection to the pituitary."},
{c:"n3",s:"Fliyou Test 3",q:"The epithalamus includes:",o:["Fornix","Habenula","Internal medullary lamina","Corpora quadrigemina"],a:[1],e:"Habenula, stria medullaris, pineal gland, posterior commissure."},
{c:"n3",s:"Fliyou Test 3",q:"What does the pineal gland secrete, and what is its role?",o:["Melatonin — circadian rhythms","Dopamine — motor pathways","Serotonin — homeostasis","GABA — sensory modulation"],a:[0],e:"Pinealocytes secrete melatonin in response to darkness."},
{c:"n3",s:"Fliyou Test 3",q:"What is the function of the habenula (epithalamus)?",o:["Regulation of body temperature","Sleep–wake control","Connection between the limbic system and other brain parts","Synthesis of melatonin"],a:[2],e:"The epithalamus connects the limbic system to the rest of the brain. Melatonin is made by the pineal gland, not the habenula."},
{c:"n3",s:"Fliyou Test 3",q:"Dysfunction of the epithalamus is associated with:",o:["Major depression","Schizophrenia","Sleeping disorders","All of the above"],a:[3],e:"All three are listed in the lecture."},
{c:"n3",s:"Fliyou Test 3",q:"Low melatonin levels typically lead to:",o:["Hyperactivity","Mood disorders","Hypertension","Memory loss"],a:[1],e:"\"Low levels of melatonin will typically give rise to mood disorders.\""},

// ===================== CH4 BRAINSTEM =====================
{c:"n4",s:"Fliyou Test 1",q:"What landmark is defined by the angle between the lower border of the pons and the upper border of the medulla?",o:["Cerebellopontine angle","Pontomedullary junction","Substantia nigra","Cruciform sulcus"],a:[1],e:"VI, VII and VIII emerge here."},
{c:"n4",s:"Fliyou Test 2",q:"The angle formed at the junction of pons, medulla and cerebellum is the:",o:["Cerebellopontine angle","Pontomedullary junction","Medullocerebellar angle","Pontocerebellar junction"],a:[0],e:"VII and VIII emerge at the cerebellopontine angle."},
{c:"n4",s:"Fliyou Test 1",q:"Which nerve originates from the lateral aspect of the mid-pons?",o:["Trigeminal (V)","Abducens (VI)","Facial (VII)","Vestibulocochlear (VIII)"],a:[0],e:"V = lateral mid-pons; VI–VII–VIII at the pontomedullary groove."},
{c:"n4",s:"Fliyou Test 3",q:"Which nerve arises from the cerebellopontine angle, the more lateral aspect of the pontomedullary junction?",o:["Trigeminal (V)","Abducens (VI)","Facial (VII)","Vestibulocochlear (VIII)"],a:[2],e:"The lecture assigns VII to the cerebellopontine angle, with VIII just lateral to it."},
{c:"n4",s:"Fliyou Test 1",q:"The two cerebral peduncles are separated (anteriorly, in the midline) by:",o:["Substantia nigra","Tegmentum","Interpeduncular fossa","Crus cerebri"],a:[2],e:"Lecture: the peduncles are separated anteriorly by the interpeduncular fossa, where CN III exits. (The original key said A: the substantia nigra separates each peduncle from the tegmentum, not the two peduncles from each other.)"},
{c:"n4",s:"Fliyou Test 3",q:"Which nerve exits between the cerebral peduncles?",o:["Trochlear (IV)","Oculomotor (III)","Abducens (VI)","Vestibulocochlear (VIII)"],a:[1],e:"III leaves through the interpeduncular fossa; IV is the only dorsal nerve."},
{c:"n4",s:"Fliyou Test 1",q:"Which part of the brainstem is joined to the cerebellum by the middle cerebellar peduncles?",o:["Midbrain","Pons","Medulla oblongata","Tectum"],a:[1],e:"Superior–midbrain, middle–pons, inferior–medulla."},
{c:"n4",s:"Fliyou Test 2",q:"Which nerve emerges from the sulcus between the pyramid and the olive?",o:["Hypoglossal (XII)","Glossopharyngeal (IX)","Vagus (X)","Accessory (XI)"],a:[0],e:"IX, X, XI emerge behind the olive."},
{c:"n4",s:"Fliyou Test 2",q:"Which vessel provides the major blood supply to the brainstem/midbrain?",o:["Anterior cerebral artery","Middle cerebral artery","Posterior cerebral artery","Basilar artery"],a:[3],e:"\"The brainstem receives its supply from the basilar artery and its branches\" (the PCA is one of these branches)."},
{c:"n4",s:"Fliyou Test 3",q:"What is the significance of an alternating syndrome?",o:["Identifies the level of the lesion","Motor coordination","Visual perception","Sensory processing"],a:[0],e:"Cranial nerve palsy on one side + contralateral hemiplegia → the nerve tells the level."},
{c:"n4",s:"Fliyou Test 3",q:"Which part of the brainstem is marked by the crus cerebri and the tegmentum?",o:["Pons","Midbrain","Medulla oblongata","Tectum"],a:[1],e:"The cerebral peduncles (crus + tegmentum) belong to the midbrain."},
{c:"n4",s:"Fliyou Test 3",q:"What forms the floor of the fourth ventricle?",o:["Rhomboid fossa","Medial eminence","Facial colliculus","Stria medullaris"],a:[0],e:"Diamond-shaped dorsal surface of pons and upper medulla; B–D are landmarks ON the floor."},
{c:"n4",s:"Fliyou Test 2",q:"What is the primary function of the ascending tracts?",o:["Motor coordination","Transmitting sensory information to the cerebral cortex","Controlling involuntary movements","Regulating autonomic functions"],a:[1],e:"Ascending = sensory; descending = motor."},
{c:"n4",s:"Fliyou Test 2",q:"Which modalities are carried by the dorsal column–medial lemniscus pathway?",o:["Pain and temperature","Crude touch and pressure","Fine touch, vibration and proprioception","Auditory sensations"],a:[2],e:"Pain/temperature/crude touch = spinothalamic (anterolateral) system."},
{c:"n4",s:"Fliyou Test 1",q:"Which of these is carried by the (lateral) spinothalamic tract?",o:["Crude touch","Pressure","Pain","Vibration"],a:[2],e:"Spinothalamic = pain and temperature (+ crude touch in the anterolateral system); vibration = dorsal columns."},
{c:"n4",s:"Fliyou Test 3",q:"Which of the following are CONSCIOUS tracts carrying sensation to the cortex?",o:["Posterior spinocerebellar tract","Anterior spinothalamic tract","Lateral spinothalamic tract","Cuneocerebellar tract"],a:[1,2],e:"Conscious = DCML + anterolateral (spinothalamic) system. Spinocerebellar tracts are UNconscious. (The original key \"AD\" was wrong.)"},
{c:"n4",s:"Fliyou Test 1",q:"What is the function of the spinocerebellar tracts?",o:["Transmitting unconscious sensations","Coordinating and refining motor movements","Regulating autonomic functions","Controlling voluntary contraction"],a:[0],e:"They are the unconscious ascending tracts."},
{c:"n4",s:"Fliyou Test 2",q:"What type of information do the spinocerebellar tracts carry?",o:["Conscious sensations","Fine touch and vibration","Unconscious proprioceptive information","Auditory and visual sensations"],a:[2],e:"Unconscious proprioception to the cerebellum."},
{c:"n4",s:"CC ANAT3 2025–26",q:"Concerning the morphology of the brainstem:",o:["The trigeminal nerve emerges from the anterior surface of the mesencephalon","The medulla rests on the lesser wing of the sphenoid","The posterior surface of the pons faces the 4th ventricle","The tectal plate is made of the quadrigeminal tubercles (colliculi)"],a:[2,3],e:"V emerges from the pons; the brainstem lies on the clivus (occipital bone)."},
{c:"n4",s:"CC ANAT3 2025–26",q:"About the cranial nerves:",o:["The abducens nerve (VI) emerges from the anterior collateral sulcus of the spinal cord","The trigeminal nerve emerges from the anterior surface of the pons","The facial nerve is a purely sensory nerve","The nucleus of the hypoglossal nerve lies in the medulla"],a:[1,3],e:"VI emerges at the pontomedullary groove; VII is mixed. XII belongs to the medulla."},
{c:"n4",s:"CC ANAT3 2025–26",q:"Concerning the brainstem:",o:["Ontogenetically, the brainstem derives from the prosencephalon","It contains ten of the twelve cranial-nerve nuclei","Topographically it lies between the diencephalon above and the spinal cord below","It is lodged at the superior orbital fissure"],a:[1,2],e:"Brainstem = mesencephalon + metencephalon + myelencephalon; it lies in the posterior fossa on the clivus."},
{c:"n4",s:"CC ANAT3 2025–26",q:"Topographical features of the brainstem:",o:["The brainstem is related to the tentorium cerebelli","The mesencephalon is related to the foramen of Pacchioni","The brainstem lies in front of the dorsum of the sella turcica","The pons straddles the supra- and infratentorial levels"],a:[0,1],e:"It lies under the tentorium, on the clivus (behind the sella). The MIDBRAIN — not the pons — passes through the tentorial notch."},
{c:"n4",s:"CC ANAT3 2025–26",q:"Concerning the systematisation of the brainstem:",o:["It is intimately related to the superior longitudinal sinus","It comprises, among others, the pons and the mesencephalon","It secretes oxytocin","It is the superposition of three levels"],a:[1,3],e:"Midbrain, pons, medulla = three superimposed levels."},
{c:"n4",s:"CC ANAT3 2025–26",q:"Morphological features of the brainstem:",o:["The superior colliculi play a role in hearing","The medullary striae of the 4th ventricle lie on the anterior surface of the medulla","The pons continues laterally as the middle cerebellar peduncles","The trochlear nerve emerges from the posterior surface of the mesencephalon"],a:[2,3],e:"Superior colliculi = vision (inferior = hearing). The striae lie on the FLOOR of the 4th ventricle (posterior)."},

// ===================== CH5 CEREBELLUM =====================
{c:"n5",s:"Fliyou Test 1",q:"What is the primary function of the vestibulocerebellum?",o:["Coordination of voluntary muscle movements","Planning and timing of movements","Vestibular reflexes and postural maintenance","Cognitive functions"],a:[2],e:"Flocculonodular lobe: balance, vestibular reflexes, eye movements."},
{c:"n5",s:"Fliyou Test 1",q:"Which part of the cerebellum integrates sensory input with motor commands for adaptive motor coordination?",o:["Vestibulocerebellum","Spinocerebellum","Cerebrocerebellum","Flocculonodular lobe"],a:[1],e:"Spinocerebellum = vermis + intermediate zones."},
{c:"n5",s:"Fliyou Test 2",q:"What is the function of the spinocerebellum?",o:["Vestibular reflexes","Adaptive motor coordination","Planning and timing of movements","Cognitive functions"],a:[1],e:"Tone, posture, trunk/limb coordination."},
{c:"n5",s:"Fliyou Test 1",q:"Which cerebellar peduncle connects the cerebellum with the midbrain?",o:["Superior","Middle","Inferior","Lateral/anterior"],a:[0],e:"Middle → pons; inferior → medulla."},
{c:"n5",s:"Fliyou Test 3",q:"How is the cerebellum connected to the brainstem?",o:["Via cranial nerves","Through spinal-cord tracts","By three pairs of cerebellar peduncles","Direct synaptic connections"],a:[2],e:"Superior, middle, inferior peduncles."},
{c:"n5",s:"Fliyou Test 2",q:"Which fissure divides the cerebellum into superior and inferior surfaces?",o:["Primary fissure","Posterolateral fissure","Horizontal fissure","Transverse fissure"],a:[2],e:"Horizontal fissure = great circumferential sulcus of Vicq d'Azyr."},
{c:"n5",s:"Fliyou Test 3",q:"Which part of the cerebellum is phylogenetically the oldest and mainly serves balance and spatial orientation?",o:["Vestibulocerebellum","Spinocerebellum","Cerebrocerebellum","Flocculonodular lobe"],a:[0,3],e:"Both names describe the same part: the flocculonodular lobe (anatomical name) = vestibulocerebellum/archicerebellum (functional name)."},
{c:"n5",s:"Fliyou Test 3",q:"Damage to the flocculonodular lobe most likely causes:",o:["Gait impairments and leg incoordination","Problems with skilled voluntary movements","Disruption of whole-body movements","Altered walking gait due to loss of equilibrium"],a:[3],e:"A = upper (anterior) part; B = lateral zone; C = midline."},
{c:"n5",s:"CC ANAT3 2025–26",q:"Concerning the cerebellum:",o:["It is lodged within the tectal plate","It is involved in emotional control","It plays a major role in balance and spatio-temporal coordination","It lies in the anterior cranial fossa"],a:[2],e:"Posterior cranial fossa, behind the brainstem; regulates tone, balance and coordination."},

// ===================== CH6 SPINAL CORD =====================
{c:"n6",s:"Fliyou Test 1",q:"Which space between arachnoid and pia mater contains CSF?",o:["Epidural space","Subdural space","Subarachnoid space","Intrathecal space"],a:[2],e:"The epidural space contains fat and venous plexus."},
{c:"n6",s:"Fliyou Test 1",q:"The spinal cord is supplied by branches of which artery, which gives the anterior and posterior spinal arteries?",o:["Carotid","Vertebral","Subclavian","Femoral"],a:[1],e:"Plus radicular arteries from segmental arteries."},
{c:"n6",s:"Fliyou Test 1",q:"The tapered end of the spinal cord, from which the filum terminale extends, is the:",o:["Cerebellopontine angle","Conus medullaris","Fastigium","Foramen magnum"],a:[1],e:"At L1–L2 in adults."},
{c:"n6",s:"Fliyou Test 1",q:"Which meningeal layer is the outermost and has periosteal and meningeal layers?",o:["Arachnoid","Pia mater","Dura mater","Subarachnoid mater"],a:[2],e:"From inside out: Pia, Arachnoid, Dura (\"PAD\")."},
{c:"n6",s:"Fliyou Test 2",q:"What anchors the spinal cord and extends from the conus medullaris to the 1st coccygeal vertebra?",o:["Filum terminale","Conus medullaris","Cauda equina","Anterior median fissure"],a:[0],e:"Thin fibrous thread anchoring the cord."},
{c:"n6",s:"Fliyou Test 2",q:"Which part of the cord contains the neurons and has a butterfly shape?",o:["Grey matter","White matter","Anterior horn","Posterior horn"],a:[0],e:"Central H-shaped grey matter; white matter is peripheral."},
{c:"n6",s:"Fliyou Test 3",q:"Apart from conduction, what is a key role of the spinal cord in neural pathways?",o:["Synthesising neurotransmitters","Modifying and integrating information","Producing CSF","Initiating voluntary movement"],a:[1],e:"\"The spinal cord is more than a conduit: it modifies and integrates the information.\""},
{c:"n6",s:"Fliyou Test 3",q:"The neurosurgical emergency of localised compression of the cord is called:",o:["Spinal shock","Spinal reflex","Spinal cord compression","Neurogenic shock"],a:[2],e:"Lesional, sublesional and spinal syndromes."},
{c:"n6",s:"Fliyou Test 3",q:"Which veins accompany the arteries of the spinal cord and drain into the vertebral venous plexus?",o:["Jugular veins","Radicular veins","Hepatic veins","Renal veins"],a:[1],e:"Spinal veins → radicular veins → internal/external vertebral venous plexus."},
{c:"n6",s:"CC ANAT3 2025–26",q:"About the spinal cord:",o:["It ends at the level of S1 in the adult","It is lodged in the sella turcica","It ends at the L1/L2 intervertebral disc in the adult","It is the caudal segment of the CNS, continuing the brainstem"],a:[2,3],e:"S1 = 6-month fetus; L3 = birth; L1/L2 = adult."},
{c:"n6",s:"CC ANAT3 2025–26",q:"Concerning the morphology of the spinal cord:",o:["The cervical enlargement extends from C4 to T1","The spinal cord is brownish","The conus medullaris generally lies at the L2 vertebra in the adult","The cervical enlargement gives the nerves of the lumbar plexus"],a:[0],e:"Cervical enlargement C4–T1 (upper limbs → brachial plexus); conus at L1–L2."},
{c:"n6",s:"CC ANAT3 2025–26",q:"Concerning the relations of the spinal cord:",o:["It is centred by a cavity called the 4th ventricle","Its means of attachment include the denticulate ligament","It sends nerve rootlets through the foramen rotundum","It is related in front to the vertebral bodies and discs, through the posterior longitudinal ligament"],a:[1,3],e:"The cord's cavity is the central canal; nerves leave through the intervertebral foramina."},
{c:"n6",s:"CC ANAT3 2025–26",q:"Morphological characteristics of the spinal cord:",o:["It is not wrapped by the arachnoid","It is parallelepiped-shaped","It comprises, among others, 8 cervical segments (myelomeres)","It has a cervical and a lumbar enlargement"],a:[2,3],e:"Cylindrical, flattened AP; wrapped by dura, arachnoid, pia; 8 cervical segments."},

// ===================== CH7 THYROID =====================
{c:"e1",s:"Hajjij Exam 2022",q:"The thyroid gland is:",o:["Paired and median","Secretes parathyroid hormones","Unpaired","Located in the infrahyoid region","Located in the suprahyoid region"],a:[2,3],e:"A unique (unpaired) median gland of the infrahyoid neck."},
{c:"e1",s:"Hajjij Exam 2021",q:"The thyroid gland:",o:["Lies in the submandibular region","Lies in the suprahyoid region","Lies in the lateral infrahyoid region","Lies in the median infrahyoid region","Is an unpaired exocrine gland"],a:[3],e:"Median infrahyoid; it is ENDOcrine."},
{c:"e1",s:"Hajjij Resit 2021",q:"The thyroid gland:",o:["Is an exocrine gland","Is median and unpaired","Lies in the infrahyoid region","Secretes parathormone"],a:[1,2],e:"PTH comes from the parathyroids; the thyroid secretes thyroid hormones and calcitonin."},
{c:"e1",s:"Hajjij Exam 2021",q:"The thyroid gland presents:",o:["One lobe","Two lobes","One isthmus","Two isthmuses","An inconstant INFERIOR extension"],a:[1,2],e:"The inconstant extension (pyramidal lobe) rises from the UPPER border of the isthmus."},
{c:"e1",s:"Hajjij Exam 2021",q:"The thyroid lodge:",o:["Is limited by the thyroid sheath","The thyroid capsule adheres to the sheath and cannot be separated from it","It is covered in front by the suprahyoid muscles and their fasciae","It is covered in front by the infrahyoid muscles and their fasciae"],a:[0,3],e:"A cleavage plane (thyroid space) exists between gland and lodge — the basis of thyroid surgery."},
{c:"e1",s:"Hajjij Exam 2021",q:"Relations of the lateral lobes of the thyroid:",o:["The medial face relates in front to the pharynx then the oesophagus","The medial face relates in front to the laryngotracheal axis","The posterior face of the lobes relates to the parathyroid glands","The right inferior laryngeal nerve arises below the aortic arch","The left inferior laryngeal nerve passes in front of the branches of the inferior thyroid artery"],a:[1,2],e:"Pharynx/oesophagus are BEHIND. The LEFT nerve arises below the arch and passes BEHIND the inferior thyroid artery branches."},
{c:"e1",s:"Hajjij Resit 2021",q:"Relations of the medial face of the thyroid lobes include:",o:["The thyroid cartilage","The hyoid bone","The trachea"],a:[0,2],e:"Top → bottom: posterior-inferior thyroid cartilage, cricoid, first 5–6 tracheal rings."},
{c:"e1",s:"Hajjij Exam 2023",q:"The most important POSTERIOR relations in thyroid surgery are:",o:["The infrahyoid muscles","The inferior laryngeal (recurrent) nerve","The internal jugular vein","The parathyroid glands","The common carotid artery"],a:[1,3],e:"Recurrent nerves and parathyroids = the major risks of thyroidectomy. The infrahyoid muscles are anterior."},
{c:"e1",s:"Hajjij Resit 2021",q:"The recurrent nerve, an important relation of the thyroid:",o:["Is a branch of the glossopharyngeal nerve (IX)","Runs in the tracheo-oesophageal angle","The right recurrent nerve arises in the mediastinum","The left recurrent nerve arises in the mediastinum","Gives sensation to the subglottic mucosa of the larynx"],a:[1,3,4],e:"Branch of the vagus (X). Right = base of neck (subclavian); left = thorax (below the aortic arch)."},
{c:"e1",s:"Hajjij Exam 2019",q:"The recurrent nerve, an important relation of the thyroid:",o:["Is exclusively motor","Runs between the trachea and the posterior face of the gland","Both recurrent nerves have a mediastinal course","Both nerves have the same termination"],a:[1,3],e:"It is also sensory (subglottis). Only the LEFT has a mediastinal course. Both end by passing under the inferior pharyngeal constrictor."},
{c:"e1",s:"Hajjij Midterm 2024",q:"Thyroid vascularisation:",o:["The middle thyroid vein drains directly into the IJV","The superior thyroid artery and vein form the (only true) superior pedicle","The inferior thyroid vein is satellite of the inferior thyroid artery","The superior thyroid artery is the 1st branch of the external carotid and divides into three branches"],a:[0,1,3],e:"The inferior thyroid veins are NOT satellite of the artery. D is stated word for word in your lecture (the 2024 key had only A and B)."},

// ===================== CH8 EAR PART 1 =====================
{c:"e2",s:"Hajjij Exam 2023",q:"The external auditory canal (tick the correct answers):",o:["Is lined by an extension of the skin of the auricle","Its MEDIAL part contains the ceruminous glands, where wax plugs form","It presents a narrowing called the isthmus","It extends from the depth of the concha/tragus to the tympanic membrane","It is fibro-cartilaginous in its outer 2/3"],a:[0,2,3],e:"Glands and cartilage are in the OUTER 1/3; the inner 2/3 is bony."},
{c:"e2",s:"Hajjij Exam 2023",q:"Tick the FALSE statement about the tympanic cavity:",o:["The posterior wall presents the aditus ad antrum, joining the cavity to the mastoid antrum","The inferior wall relates to the internal jugular vein (jugular bulb)","The anterior wall presents the orifice of the auditory tube","The superior wall is formed by the tegmen tympani","The medial wall is also called the mastoid wall"],a:[4],e:"Medial wall = labyrinthine wall. The POSTERIOR wall is the mastoid wall."},
{c:"e2",s:"Hajjij Exam 2022",q:"Tick the correct statements about the tympanic cavity:",o:["The superior wall relates to the meninges of the middle cranial fossa","The inferior wall presents the orifice of the auditory tube","The anterior wall relates to the internal jugular vein","The inferior wall is also called the jugular wall","The anterior wall is also called the carotid wall"],a:[0,3,4],e:"Auditory-tube orifice = anterior wall; IJV bulb = floor."},
{c:"e2",s:"Hajjij Midterm 2024",q:"The tympanic cavity is bounded by walls:",o:["The tegmen tympani is the superior wall","The anterior wall is the mastoid bone/cells","The lateral wall is the eardrum (tympanic membrane)","The medial wall opens to the outer and middle ear"],a:[0,2],e:"Mastoid = POSTERIOR wall; medial wall faces the inner ear."},
{c:"e2",s:"Hajjij Resit 2021",q:"The tympanic cavity:",o:["Its lateral wall is the tympanic membrane","Its medial wall connects the external and middle ear","Its internal wall relates to the tegmen tympani","Its anterior wall relates to the mastoid","Its anterior wall relates to the Eustachian tube"],a:[0,4],e:"Tegmen = roof; mastoid = posterior wall."},
{c:"e2",s:"Hajjij Exam 2023",q:"The medial (internal) wall of the tympanic cavity relates to:",o:["The mastoid","The Eustachian tube","The oval window","The promontory","The 2nd (tympanic) portion of the facial canal"],a:[2,3,4],e:"Medial wall: facial-canal prominence, lateral SCC prominence, promontory, oval and round windows."},
{c:"e2",s:"Hajjij Exam 2022",q:"The pars tensa:",o:["Is the upper part of the eardrum","Is the lower (main) part of the eardrum","Has 3 layers","Has 2 layers","Has a fibrous layer"],a:[1,2,4],e:"Pars flaccida is the small upper part; pars tensa has cuticular, fibrous and mucosal layers."},
{c:"e2",s:"Hajjij Exam 2019",q:"The three layers of the tympanic membrane are:",o:["An outer cutaneous (cuticular) layer","An inner cutaneous layer","An inner mucosal layer","An inner fibrous layer"],a:[0,2],e:"Lateral → medial: cuticular, fibrous (MIDDLE), mucosal."},
{c:"e2",s:"Hajjij Exam 2023",q:"The ossicular chain presents the following joints:",o:["Incudo-malleolar","Malleo-stapedial","Stapedo-malleolar","Incudo-stapedial","Tympano-stapedial"],a:[0,3],e:"Malleus–incus–stapes in a row: the malleus never touches the stapes."},
{c:"e2",s:"Hajjij Midterm 2024",q:"Joints of the ossicles of the middle ear:",o:["Incudomalleolar joint","Stapediomalleolar joint","Incudostapedial joint","Malleostapedial joint"],a:[0,2],e:"\"MIS\": Malleus–Incus, Incus–Stapes."},
{c:"e2",s:"Hajjij Resit 2021",q:"The incudo-stapedial joint:",o:["Is formed by the incus and the stapes","Is formed by the stapes and the malleus","Is formed by the malleus and the incus","Is the closest to the eardrum","Is the only joint of the ear"],a:[0],e:"The incudomalleolar joint is closer to the eardrum."},
{c:"e2",s:"Hajjij Midterm 2024",q:"The auditory tube:",o:["Is also called the Eustachian tube","Is a cartilaginous tube","Is a fibro-cartilaginous tube","Is an osteo-cartilaginous tube"],a:[0,3],e:"Posterosuperior bony part + anterior cartilaginous part."},
{c:"e2",s:"Hajjij Exam 2022",q:"The auditory tube:",o:["Is a fibro-cartilaginous canal","Is an osteo-cartilaginous canal","Is the Eustachian tube","Opens with each swallowing movement","Joins the POSTERIOR wall of the tympanic cavity to the nasopharynx"],a:[1,2,3],e:"It opens on the ANTERIOR wall."},

// ===================== CH9 EAR PART 2 =====================
{c:"e3",s:"Hajjij Midterm 2024",q:"Correct statement(s) about the labyrinth:",o:["From inside the membranous labyrinth outward, there are 2 liquids: endolymph and perilymph","From inside outward there are 3 liquids: endolymph, perilymph and CSF","The inner ear is filled mostly with air","The bony labyrinth houses the membranous labyrinth"],a:[0,3],e:"Endolymph inside the membranous labyrinth; perilymph between it and the bone."},
{c:"e3",s:"Hajjij Exam 2023",q:"Correct statement(s) about the labyrinth:",o:["From inside outward there are 3 liquids: CSF, endolymph and perilymph","From inside outward there are 2 liquids: endolymph and perilymph","The bony labyrinth houses the membranous labyrinth","The inner ear contains no liquid","The membranous labyrinth is made of the cochlear duct, the semicircular ducts and the utricle"],a:[1,2],e:"E is incomplete: the SACCULE is missing."},
{c:"e3",s:"Hajjij Exam 2021",q:"The posterior membranous labyrinth:",o:["Is meant for hearing","Comprises the utricle, the saccule and the semicircular ducts","Contains perilymph"],a:[1],e:"Posterior = balance; the membranous labyrinth contains ENDOlymph."},
{c:"e3",s:"Hajjij Exam 2022",q:"The membranous semicircular canals (ducts):",o:["Communicate directly with the saccule","Are part of the balance apparatus with the utricle and saccule","Detect (angular) movements of the head","Play an important role in hearing","Are coiled in 2.5 turns"],a:[1,2],e:"They open into the UTRICLE (5 openings). 2.5 turns describes the cochlea."},
{c:"e3",s:"Hajjij Exam 2022",q:"The membranous cochlea (cochlear duct):",o:["Is a tube coiled in 2 turns","Lines (doubles) the bony cochlea","Houses the organ of Corti","Is made of 2 vesicles","Is filled with perilymph"],a:[1,2],e:"2½–2¾ turns; filled with ENDOlymph; utricle and saccule are the vesicles of the vestibule."},

function card(q,k){const s=state[q.id]||{sel:[]};const done=!!s.done;const multi=q.a.length>1;

 if(q.a.length>1){s.sel=s.sel.includes(i)?s.sel.filter(x=>x!==i):[...s.sel,i]}else s.sel=[i];save();refresh(q)}
function check(id){const q=Q[id];const s=state[id]||(state[id]={sel:[]});if(!s.sel.length)return;
 s.done=true;s.ok=s.sel.length===q.a.length&&q.a.every(x=>s.sel.includes(x));save();refresh(q)}
function undo(id){state[id]={sel:[]};save();refresh(Q[id])}
function revealAll(id){byCh(id).forEach(q=>{const s=state[q.id]||(state[q.id]={sel:[]});if(!s.done){s.done=true;s.ok=s.sel.length===q.a.length&&q.a.every(x=>s.sel.includes(x))}});save();render(id)}
function resetCh(id){byCh(id).forEach(q=>delete state[q.id]);save();render(id)}

// ================= EXAM GENERATOR =================
const SIZES=[5,10,15,20,30,40,50,60,70,80,100];
let EX={sel:new Set(CH.map(c=>c.id)),n:20,list:null,ans:{},sub:false,mode:"real"};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// frequency of each chapter in past exams (question counts, see analysis)
const FREQ={n1:51,n2:98,n3:46,n4:85,n5:37,n6:39,e1:34,e2:25,e3:12,e4:34};
function plan(ids,n){ // returns {id:count}
 const avail=Object.fromEntries(ids.map(id=>[id,byCh(id).length]));
 const parts={};ids.forEach(id=>(parts[part(id)]=parts[part(id)]||[]).push(id));
 const w={};Object.values(parts).forEach(pids=>{const share=pids.length/ids.length;const tot=pids.reduce((s,id)=>s+(EX.mode==="real"?FREQ[id]:1),0);pids.forEach(id=>w[id]=share*(EX.mode==="real"?FREQ[id]:1)/tot)});
 const cnt=Object.fromEntries(ids.map(id=>[id,0]));let left=Math.min(n,ids.reduce((s,id)=>s+avail[id],0));
 while(left>0){ // give next question to the chapter furthest below its target, among those with questions left
  const open=ids.filter(id=>cnt[id]<avail[id]);if(!open.length)break;
  const tw=open.reduce((s,id)=>s+w[id],0);const placed=ids.reduce((s,id)=>s+cnt[id],0)+1;
  let best=open[0],bd=-1e9;open.forEach(id=>{const d=placed*w[id]/tw-cnt[id];if(d>bd){bd=d;best=id}});cnt[best]++;left--}
 return cnt}
function buildExam(){const ids=CH.filter(c=>EX.sel.has(c.id)).map(c=>c.id);if(!ids.length)return;
 const cnt=plan(ids,EX.n);let out=[];ids.forEach(id=>out=out.concat(shuf(byCh(id)).slice(0,cnt[id])));
 const rank=Object.fromEntries(CH.map((c,i)=>[c.id,i]));
 EX.list=out.sort((a,b)=>rank[a.c]-rank[b.c]);EX.ans={};EX.sub=false;render("exam")}
function examView(){const m=document.getElementById("main");
 if(EX.list){return examRun()}
 const avail=CH.filter(c=>EX.sel.has(c.id)).reduce((s,c)=>s+byCh(c.id).length,0);
 let h=`<div class="hero2"><div class="goat">🎯</div><div class="k">Exam generator</div><h2>Build your own exam</h2><p>Pick the chapters and the number of questions. In <b>Realistic</b> mode, chapters that come up most often in past exams get more questions, like in the real final; <b>Balanced</b> mode spreads them evenly. You get your score and a detailed correction at the end.</p></div>
 <div class="card"><div class="sec">1 · Chapters</div><div class="qsel">
 <button class="btn" onclick="exAll('all')">All</button><button class="btn" onclick="exAll('n')">All Neuroanatomy</button><button class="btn" onclick="exAll('e')">All ENT</button><button class="btn" onclick="exAll('none')">None</button></div>
 <div class="chk">${CH.map(c=>`<label class="${part(c.id)} ${EX.sel.has(c.id)?"on":""}"><input type="checkbox" ${EX.sel.has(c.id)?"checked":""} onchange="exTog('${c.id}')"><span class="n">${c.num}</span><span>${c.t}</span><em>${byCh(c.id).length}</em></label>`).join("")}</div>
 <div class="sec" style="margin-top:18px">2 · Number of questions</div><div class="sizes">${SIZES.map(s=>`<button class="sz ${EX.n===s?"on":""} ${s>avail?"off":""}" onclick="EX.n=${s};render('exam')">${s}</button>`).join("")}</div>
 <div class="sec" style="margin-top:18px">3 · Distribution</div><div class="sizes"><button class="sz ${EX.mode==="real"?"on":""}" onclick="EX.mode='real';render('exam')">📊 Realistic (past-exam frequency)</button><button class="sz ${EX.mode==="eq"?"on":""}" onclick="EX.mode='eq';render('exam')">⚖️ Balanced</button></div>
 <p class="small" style="margin:10px 0 6px">${avail} questions available${EX.n>avail?` — the exam will use all ${avail}`:""}. Planned questions per chapter:</p>
 <div class="plan">${(()=>{const ids=CH.filter(c=>EX.sel.has(c.id)).map(c=>c.id);if(!ids.length)return "";const p=plan(ids,EX.n);return ids.map(id=>{const c=CH.find(x=>x.id===id);return `<div class="${part(id)}"><span class="n">${c.num}</span><span class="t">${c.t}</span><span class="bar"><i style="width:${100*p[id]/Math.max(...Object.values(p))}%"></i></span><b>${p[id]}</b></div>`}).join("")})()}</div>
 <p class="small" style="margin:8px 0 0">Frequencies come from ~460 past exam questions (Fliyou tests, CC 2025–26, UM6SS neuroanatomy exams 2018–2023 and Pr Hajjij's ENT exams 2019–2024). Small chapters are capped by the number of questions available, and the rest goes to the next most frequent chapters.</p>
 <div style="margin-top:16px"><button class="btn pri big" ${EX.sel.size?"":"disabled"} onclick="buildExam()">Start the exam →</button></div></div>`;
 m.innerHTML=h}
function exTog(id){EX.sel.has(id)?EX.sel.delete(id):EX.sel.add(id);render("exam")}
function exAll(w){EX.sel=new Set(w==="none"?[]:CH.filter(c=>w==="all"||c.id[0]===w).map(c=>c.id));render("exam")}
function exPick(id,i){if(EX.sub)return;const q=Q[id];const s=EX.ans[id]||(EX.ans[id]=[]);
 if(q.a.length>1){const k=s.indexOf(i);k>=0?s.splice(k,1):s.push(i)}else EX.ans[id]=[i];
 const el=document.getElementById("x"+id);el.outerHTML=exCard(q,+el.dataset.k);exBar()}
function exOk(q){const s=EX.ans[q.id]||[];return s.length===q.a.length&&q.a.every(x=>s.includes(x))}
function exCard(q,k){const s=EX.ans[q.id]||[];const multi=q.a.length>1;const c=CH.find(x=>x.id===q.c);
 const o=q.o.map((t,i)=>{let cl="opt";if(EX.sub){const A=q.a.includes(i),S=s.includes(i);if(A&&S)cl+=" right";else if(S)cl+=" wrong";else if(A)cl+=" missed"}else if(s.includes(i))cl+=" sel";
  return `<div class="${cl}" onclick="exPick(${q.id},${i})"><span class="L">${L[i]}</span><span>${t}</span></div>`}).join("");
 let res="";if(EX.sub){const ok=exOk(q);res=`<div class="act"><span class="res ${ok?"ok":"ko"}">${ok?"✓ Correct":(s.length?"✗ Wrong":"— Not answered")} · correct answer: ${q.a.map(i=>L[i]).join(", ")}${s.length?` · your answer: ${s.slice().sort().map(i=>L[i]).join(", ")}`:""}</span></div>
  <div class="exp" style="display:block"><b>Detailed correction.</b> ${q.o.map((t,i)=>`<div class="why ${q.a.includes(i)?"t":"f"}">${q.a.includes(i)?"✔":"✘"} <b>${L[i]}</b> — ${t}</div>`).join("")}<p style="margin:8px 0 0">${q.e}</p>
  <div class="src"><span>📖 Handbook <b>page ${PG[q.id]}</b> (answer framed in green)</span><img loading="lazy" src="ex/q${q.id}.jpg"></div>
  <div class="src"><span>📄 Original: <b>${OG[q.id][0]}</b>, page ${OG[q.id][1]}</span><img loading="lazy" src="og/q${q.id}.jpg"></div></div>`}
 return `<div class="card ${part(q.c)} ${EX.sub?"done":""}" id="x${q.id}" data-k="${k}"><div class="top"><span class="qn">${k}</span><div><div class="stem">${q.q}</div><div class="meta"><span class="tag">Ch. ${c.num} · ${c.t}</span><span class="tag">${q.s}</span>${multi?'<span class="tag multi">Multiple answers</span>':""}</div></div></div><div class="opts">${o}</div>${res}</div>`}
function exBar(){const n=EX.list.length,d=EX.list.filter(q=>(EX.ans[q.id]||[]).length).length;const b=document.getElementById("exbar");if(b)b.innerHTML=`<span>${d}/${n} answered</span><div class="track" style="flex:1;background:#e3e6ee"><i style="width:${100*d/n}%"></i></div><button class="btn pri" onclick="exSubmit()">Submit exam</button>`}
function exSubmit(){const left=EX.list.filter(q=>!(EX.ans[q.id]||[]).length).length;
 if(left&&!window.__sx){window.__sx=1;const b=document.querySelector("#exbar .btn");b.textContent=`${left} unanswered — click again to submit`;return}
 window.__sx=0;EX.sub=true;
 // count exam answers in global progress too
 EX.list.forEach(q=>{state[q.id]={sel:(EX.ans[q.id]||[]).slice(),done:true,ok:exOk(q)}});save();
 try{const hist=JSON.parse(localStorage.getItem("mcq-exams")||"[]");hist.push({d:Date.now(),n:EX.list.length,ok:EX.list.filter(exOk).length});localStorage.setItem("mcq-exams",JSON.stringify(hist.slice(-20)))}catch(e){}
 render("exam")}
function examRun(){const n=EX.list.length;let h="";
 if(EX.sub){const ok=EX.list.filter(exOk).length;const pct=Math.round(100*ok/n);const note20=(20*ok/n).toFixed(1);
  const lvl=pct>=85?"GOAT level 🐐":pct>=70?"Very good 💪":pct>=50?"Pass — keep going 📚":"Review the handbook 📖";
  const per=CH.filter(c=>EX.list.some(q=>q.c===c.id)).map(c=>{const qs=EX.list.filter(q=>q.c===c.id);const o=qs.filter(exOk).length;const p=Math.round(100*o/qs.length);
   return `<div class="pc ${part(c.id)}"><div><b>${c.num}. ${c.t}</b><span>${o}/${qs.length}</span></div><div class="pb"><i style="width:${p}%;background:${p>=70?"#2e9e6a":p>=50?"#e0a419":"#c0392b"}"></i></div></div>`}).join("");
  let hist=[];try{hist=JSON.parse(localStorage.getItem("mcq-exams")||"[]")}catch(e){}
  h+=`<div class="hero2"><div class="goat">${pct>=85?"🐐":pct>=50?"🎉":"📖"}</div><div class="k">Exam result</div><h2>${ok} / ${n} correct · ${pct}%</h2><p>Grade: <b>${note20} / 20</b> · ${lvl}${hist.length>1?` · previous exam: ${Math.round(100*hist[hist.length-2].ok/hist[hist.length-2].n)}%`:""}</p>
  <div class="cta"><button class="w" onclick="EX.list=null;render('exam')">New exam</button><button class="g" onclick="exRetry()">Retry the same questions</button><button class="g" onclick="exWrongOnly()">Only my mistakes</button></div></div>
  <div class="card"><div class="sec">Score by chapter</div><div class="pcs">${per}</div></div>
  <h3 style="margin:18px 0 10px">Detailed correction</h3>`}
 else h+=`<div class="hero2" style="padding:22px 28px"><div class="k">Exam in progress</div><h2 style="font-size:26px">${n} questions · ${new Set(EX.list.map(q=>q.c)).size} chapters</h2><p style="margin:0">Answer everything, then submit — the correction appears only at the end.</p></div>
  <div class="exbar" id="exbar"></div>`;
 EX.list.forEach((q,i)=>h+=exCard(q,i+1));
 if(!EX.sub)h+=`<div style="margin-top:10px"><button class="btn pri big" onclick="exSubmit()">Submit exam</button> <button class="btn" onclick="EX.list=null;render('exam')">Cancel</button></div>`;
 document.getElementById("main").innerHTML=h;if(!EX.sub)exBar()}
function exRetry(){EX.ans={};EX.sub=false;EX.list=shuf(EX.list);render("exam")}
function exWrongOnly(){const w=EX.list.filter(q=>!exOk(q));if(!w.length)return;EX.list=w;EX.ans={};EX.sub=false;render("exam")}

window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"home"));
render(location.hash.slice(1)||"home");
</script></body></html>
